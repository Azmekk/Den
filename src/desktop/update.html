<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Den — Update Available</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: hsl(240 10% 3.9%);
      color: hsl(0 0% 98%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-app-region: drag;
    }

    .container {
      -webkit-app-region: no-drag;
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 2rem;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: hsl(240 5% 64.9%);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .version {
      font-weight: 600;
      color: hsl(0 0% 98%);
    }

    button {
      width: 100%;
      padding: 0.75rem 1rem;
      background: hsl(231 77% 60%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .progress-section {
      display: none;
    }

    .progress-section.visible {
      display: block;
    }

    .progress-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: hsl(240 5% 64.9%);
    }

    .progress-percent {
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 8px;
      width: 100%;
      border-radius: 9999px;
      background: hsl(240 3.7% 15.9%);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: hsl(231 77% 60%);
      transition: width 0.3s;
      width: 0%;
    }

    .installing-text {
      display: none;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: hsl(240 5% 64.9%);
    }

    .installing-text.visible {
      display: block;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.25rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="icons/icon.png" alt="Den" />
    <h1>Update Available</h1>
    <p class="subtitle">
      A new version <span class="version" id="versionText"></span> is available.
      <br>Please update to continue using Den.
    </p>

    <button id="updateBtn">Update Now</button>

    <div class="progress-section" id="progressSection">
      <div class="progress-label">
        <span>Downloading...</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <p class="installing-text" id="installingText">
      <span class="spinner"></span>
      Installing update and restarting...
    </p>
  </div>

  <script>
    const versionText = document.getElementById('versionText');
    const updateBtn = document.getElementById('updateBtn');
    const progressSection = document.getElementById('progressSection');
    const progressPercent = document.getElementById('progressPercent');
    const progressFill = document.getElementById('progressFill');
    const installingText = document.getElementById('installingText');

    let isDownloading = false;

    window.denDesktop.onUpdateAvailable((version) => {
      versionText.textContent = 'v' + version;
    });

    window.denDesktop.onDownloadProgress((percent) => {
      progressPercent.textContent = percent + '%';
      progressFill.style.width = percent + '%';
    });

    window.denDesktop.onUpdateDownloaded(() => {
      // Auto-install since updates are mandatory
      progressSection.classList.remove('visible');
      updateBtn.style.display = 'none';
      installingText.classList.add('visible');
      window.denDesktop.installUpdate();
    });

    updateBtn.addEventListener('click', () => {
      if (isDownloading) return;
      isDownloading = true;
      updateBtn.style.display = 'none';
      progressSection.classList.add('visible');
      window.denDesktop.downloadUpdate();
    });
  </script>
</body>
</html>
