services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-den}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-den}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-den}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/azmekk/den:latest
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-den}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-den}?sslmode=disable
      APP_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      MAX_MESSAGES: ${MAX_MESSAGES:-50}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-true}
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BUCKET_ENDPOINT: ${BUCKET_ENDPOINT:-}
      BUCKET_NAME: ${BUCKET_NAME:-}
      BUCKET_REGION: ${BUCKET_REGION:-}
      BUCKET_ACCESS_KEY: ${BUCKET_ACCESS_KEY:-}
      BUCKET_SECRET_KEY: ${BUCKET_SECRET_KEY:-}
      BUCKET_PUBLIC_URL: ${BUCKET_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
